# .github/workflows/codeql.yml
name: CodeQL
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
jobs:
  codeql:
    permissions:
      security-events: write
      contents: read
      actions: read
    uses: akhiljayaraj/.github/.github/workflows/codeql.yml@v1
    with:
      languages: javascript-typescript
